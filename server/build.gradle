plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.0' // Spring Boot 버전 수정
	id 'io.spring.dependency-management' version '1.1.0'
}

group = 'SmTHmIoT'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '21'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5' // MQTT 클라이언트 추가
	implementation 'com.google.code.gson:gson:2.10.1'
	runtimeOnly 'com.mysql:mysql-connector-j:8.0.33' // MySQL 커넥터 추가
	runtimeOnly 'com.h2database:h2' // H2 데이터베이스 추가
	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}